version: "3.9"

services:
  malnutrition-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kenya-malnutrition-api
    ports:
      - "8000:8000"
    environment:
      - MODEL_DIR=/app/models
    volumes:
      # Mount models directory so you can update models without rebuilding
      - ./models:/app/models:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
